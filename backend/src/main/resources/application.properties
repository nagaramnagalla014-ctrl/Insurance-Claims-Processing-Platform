server.port=8080

# Oracle DataSource
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=claims_user
spring.datasource.password=claims123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Elasticsearch
spring.elasticsearch.rest.uris=http://localhost:9200
spring.data.elasticsearch.repositories.enabled=true

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# JWT
app.jwt.secret=InsuranceClaimsProcessingPlatform2019SecretKeyForJWTTokenGeneration
app.jwt.expiration=86400000

# Claims upload directory
app.upload.dir=./uploads

# Logging
logging.level.com.insurance.claims=INFO
logging.level.org.springframework.security=WARN
