version: '3.7'

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: claims-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: rootpass
      APP_USER: claims_user
      APP_USER_PASSWORD: claims123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.6.2
    container_name: claims-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: claims-backend
    restart: unless-stopped
    depends_on:
      - oracle
      - elasticsearch
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: claims_user
      SPRING_DATASOURCE_PASSWORD: claims123
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      APP_JWT_SECRET: InsuranceClaimsProcessingPlatform2019SecretKeyForJWTTokenGeneration
      APP_JWT_EXPIRATION: 86400000
      APP_UPLOAD_DIR: /uploads
    volumes:
      - uploads:/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: claims-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  oracle_data:
  es_data:
  uploads:
